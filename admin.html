<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELYSIA – Admin Guest Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #040914;
      --panel: #0a1931;
      --panel2: #0d1e38;
      --gold: #d4af37;
      --gold2: #ffd700;
      --text: #f0f4fc;
      --muted: #9bb2d4;
      --danger: #ff5c68;
      --success: #64d88a;
      --line: rgba(212,175,55,.22);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, #0a2346 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
    }

    body { min-height: 100vh; }

    button, input { font: inherit; }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(440px, 100%);
      background: rgba(10,25,49,.88);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 34px;
      box-shadow: 0 25px 70px rgba(0,0,0,.55);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .crest {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: #001f54;
      box-shadow: 0 0 24px rgba(212,175,55,.25);
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 3px;
      font-size: .72rem;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: 'Cinzel', serif;
    }

    .login-card h1 {
      margin: 8px 0 8px;
      font-size: 2rem;
      color: var(--gold2);
    }

    .subtitle {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      text-align: left;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(212,175,55,.3);
      border-radius: 9px;
      background: rgba(3,9,18,.85);
      color: white;
      padding: 13px 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold2);
      box-shadow: 0 0 14px rgba(212,175,55,.15);
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: .2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    input[readonly] {
      opacity: .78;
      cursor: not-allowed;
      border-color: rgba(212,175,55,.5);
    }

    .btn-gold {
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #fff2b2, #aa8214);
      color: #07101d;
    }

    .btn-secondary {
      background: rgba(255,255,255,.07);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
    }

    .btn-danger {
      background: rgba(255,92,104,.12);
      color: #ff8c94;
      border: 1px solid rgba(255,92,104,.35);
    }

    .error {
      display: none;
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
      color: #ff8c94;
      background: rgba(255,92,104,.1);
      border: 1px solid rgba(255,92,104,.3);
      font-size: .82rem;
    }

    .loading {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 14px;
    }

    .admin-app {
      min-height: 100vh;
      padding: 24px;
    }

    .topbar {
      max-width: 1400px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 18px 20px;
      background: rgba(10,25,49,.82);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #001f54;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: 1px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: .72rem;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-email {
      color: var(--muted);
      font-size: .75rem;
      margin-right: 4px;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 18px;
      background: rgba(10,25,49,.75);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .stat-label {
      color: var(--muted);
      font-size: .74rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .stat-value {
      margin-top: 7px;
      font-family: 'Cinzel', serif;
      font-size: 1.55rem;
      color: var(--gold2);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 240px;
    }

    .table-wrap {
      background: rgba(10,25,49,.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 820px;
    }

    th, td {
      padding: 14px 15px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: .82rem;
    }

    th {
      color: var(--gold-light, #fef1b8);
      font-family: 'Cinzel', serif;
      font-size: .73rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    td { color: #e6edf8; }

    tr:last-child td { border-bottom: 0; }

    .ticket {
      color: var(--gold2);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .actions {
      display: flex;
      gap: 7px;
      white-space: nowrap;
    }

    .small-btn {
      padding: 7px 10px;
      font-size: .72rem;
      border-radius: 7px;
    }

    .empty {
      text-align: center;
      padding: 36px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(540px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #0a1931;
      border: 1px solid var(--gold);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 30px 90px rgba(0,0,0,.7);
    }

    .modal h2 {
      margin: 0 0 18px;
      color: var(--gold2);
      font-size: 1.35rem;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .modal-actions .btn { width: auto; }

    .notice {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: .78rem;
      display: none;
    }

    .notice.success {
      display: block;
      color: #8ef0ad;
      background: rgba(100,216,138,.1);
      border: 1px solid rgba(100,216,138,.25);
    }

    .notice.error {
      display: block;
    }

    @media (max-width: 720px) {
      .admin-app { padding: 12px; }
      .stats { grid-template-columns: 1fr; }
      .topbar { padding: 14px; }
      .admin-email { width: 100%; }
      .login-card { padding: 26px 20px; }
    }
  </style>
</head>

<body>

  <!-- ADMIN LOGIN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="crest">🔐</div>
      <div class="eyebrow">ELYSIA 2026</div>
      <h1>Admin Portal</h1>
      <div class="subtitle">
        Secure guest management for the ELYSIA Reunion.
      </div>

      <form id="adminLoginForm">
        <div class="field">
          <label for="adminEmail">ADMIN EMAIL</label>
          <input id="adminEmail" type="email" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="adminPassword">PASSWORD</label>
          <input id="adminPassword" type="password" autocomplete="current-password" required />
        </div>

        <div id="loginError" class="error"></div>

        <button id="loginBtn" class="btn btn-gold" type="submit">
          ADMIN LOGIN
        </button>
      </form>

      <div id="loginLoading" class="loading hidden">
        Connecting securely...
      </div>
    </div>
  </section>

  <!-- ADMIN APP -->
  <main id="adminApp" class="admin-app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">👑</div>
        <div>
          <div class="brand-title">ELYSIA ADMIN</div>
          <div class="brand-sub">Guest & Royal Gate Pass Management</div>
        </div>
      </div>

      <div class="top-actions">
        <span id="adminEmailDisplay" class="admin-email"></span>
        <button id="refreshBtn" class="btn btn-secondary">↻ Refresh</button>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </header>

    <section class="dashboard">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total Guests</div>
          <div id="totalGuests" class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Visible Results</div>
          <div id="visibleGuests" class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Database</div>
          <div class="stat-value" style="font-size:1.05rem;">Firestore</div>
        </div>
      </div>

      <div id="notice" class="notice"></div>

      <div class="toolbar">
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Search name, NIC, phone or ticket ID..."
          autocomplete="off"
        />
        <button id="addGuestBtn" class="btn btn-gold">+ Add Guest</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>NAME</th>
              <th>NIC</th>
              <th>PHONE</th>
              <th>TICKET ID</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="guestTableBody"></tbody>
        </table>

        <div id="emptyState" class="empty hidden">
          No guest records found.
        </div>
      </div>
    </section>
  </main>

  <!-- ADD / EDIT MODAL -->
  <div id="guestModalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2 id="modalTitle">Add Guest</h2>

      <form id="guestForm">
        <input id="editingOriginalNic" type="hidden" />

        <div class="field">
          <label for="guestName">FULL NAME</label>
          <input id="guestName" type="text" required />
        </div>

        <div class="field">
          <label for="guestNic">NIC</label>
          <input id="guestNic" type="text" required autocomplete="off" />
        </div>

        <div class="field">
          <label for="guestPhone">PHONE</label>
          <input id="guestPhone" type="tel" required />
        </div>

        <div class="field">
          <label for="guestTicketId">TICKET ID</label>
          <input id="guestTicketId" type="text" placeholder="Auto-generated" required readonly />
        </div>

        <div id="formError" class="error"></div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveGuestBtn" class="btn btn-gold">Save Guest</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    /* ============================================================
       ELYSIA ADMIN PORTAL
       Firebase Authentication + Cloud Firestore
       ============================================================ */

    const firebaseConfig = {
      apiKey: "AIzaSyDGHS7j_Ovj0N-b-8RW71HyvEdTABKMdFA",
      authDomain: "elysia-reunion.firebaseapp.com",
      projectId: "elysia-reunion",
      storageBucket: "elysia-reunion.firebasestorage.app",
      messagingSenderId: "985506879172",
      appId: "1:985506879172:web:cf62355fb3ee406331b91",
      measurementId: "G-EDYKJD8HZL"
    };

    const ADMIN_UID = "6UzYHxndhxRwIA03mRbxEpENXm93";

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    let allGuests = [];

    const loginScreen = document.getElementById("loginScreen");
    const adminApp = document.getElementById("adminApp");
    const loginForm = document.getElementById("adminLoginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const loginLoading = document.getElementById("loginLoading");

    const tableBody = document.getElementById("guestTableBody");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const totalGuests = document.getElementById("totalGuests");
    const visibleGuests = document.getElementById("visibleGuests");
    const notice = document.getElementById("notice");

    const modalBackdrop = document.getElementById("guestModalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const guestForm = document.getElementById("guestForm");
    const formError = document.getElementById("formError");
    const editingOriginalNic = document.getElementById("editingOriginalNic");

    function normalizeNIC(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[\s\-_]/g, "");
    }

    function showLoginError(message) {
      loginError.textContent = message;
      loginError.style.display = "block";
    }

    function hideLoginError() {
      loginError.style.display = "none";
      loginError.textContent = "";
    }

    function showFormError(message) {
      formError.textContent = message;
      formError.style.display = "block";
    }

    function hideFormError() {
      formError.textContent = "";
      formError.style.display = "none";
    }

    function showNotice(message, type = "success") {
      notice.textContent = message;
      notice.className = "notice " + type;

      clearTimeout(showNotice.timer);
      showNotice.timer = setTimeout(() => {
        notice.className = "notice";
        notice.textContent = "";
      }, 3500);
    }

    function setLoginBusy(busy) {
      loginBtn.disabled = busy;
      loginBtn.textContent = busy ? "SIGNING IN..." : "ADMIN LOGIN";
      loginLoading.classList.toggle("hidden", !busy);
    }

    /* ------------------------------------------------------------
       AUTH
       ------------------------------------------------------------ */

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideLoginError();

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      if (!email || !password) {
        showLoginError("Please enter your admin email and password.");
        return;
      }

      setLoginBusy(true);

      try {
        const credential = await auth.signInWithEmailAndPassword(email, password);

        if (!credential.user || credential.user.uid !== ADMIN_UID) {
          await auth.signOut();
          showLoginError("This account is not authorized as an ELYSIA administrator.");
          return;
        }

        await openAdminPortal(credential.user);

      } catch (error) {
        console.error("Admin login error:", error);

        if (error && (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        )) {
          showLoginError("Incorrect email or password.");
        } else if (error && error.code === "auth/too-many-requests") {
          showLoginError("Too many login attempts. Please wait and try again.");
        } else {
          showLoginError("Could not sign in. Please try again.");
        }
      } finally {
        setLoginBusy(false);
      }
    });

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        loginScreen.classList.remove("hidden");
        adminApp.classList.add("hidden");
        return;
      }

      if (user.uid !== ADMIN_UID) {
        await auth.signOut();
        return;
      }

      await openAdminPortal(user);
    });

    async function openAdminPortal(user) {
      loginScreen.classList.add("hidden");
      adminApp.classList.remove("hidden");

      document.getElementById("adminEmailDisplay").textContent = user.email || "";

      await loadGuests();
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await auth.signOut();
    });

    /* ------------------------------------------------------------
       FIRESTORE
       ------------------------------------------------------------ */

    async function loadGuests() {
      try {
        const snapshot = await db.collection("guests").get();

        allGuests = snapshot.docs.map(doc => {
          const data = doc.data() || {};

          return {
            docId: doc.id,
            name: String(data.name || "").trim(),
            nic: String(data.nic || doc.id).trim(),
            phone: String(data.phone || "").trim(),
            ticketId: String(data.ticketId || "").trim()
          };
        });

        allGuests.sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
        );

        totalGuests.textContent = allGuests.length;
        renderGuests();

      } catch (error) {
        console.error("Guest load error:", error);

        if (error && error.code === "permission-denied") {
          showNotice("Firestore denied admin access. Check the Admin UID in Rules.", "error");
        } else {
          showNotice("Could not load guest records.", "error");
        }
      }
    }

    function renderGuests() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = allGuests.filter(guest => {
        if (!query) return true;

        return [
          guest.name,
          guest.nic,
          guest.phone,
          guest.ticketId
        ].some(value => value.toLowerCase().includes(query));
      });

      visibleGuests.textContent = filtered.length;
      tableBody.innerHTML = "";

      if (!filtered.length) {
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      filtered.forEach(guest => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHtml(guest.name)}</td>
          <td>${escapeHtml(guest.nic)}</td>
          <td>${escapeHtml(guest.phone)}</td>
          <td class="ticket">${escapeHtml(guest.ticketId)}</td>
          <td>
            <div class="actions">
              <button class="btn btn-secondary small-btn" onclick="editGuest('${escapeAttr(guest.docId)}')">Edit</button>
              <button class="btn btn-danger small-btn" onclick="deleteGuest('${escapeAttr(guest.docId)}')">Delete</button>
            </div>
          </td>
        `;

        tableBody.appendChild(tr);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return String(value).replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }

    searchInput.addEventListener("input", renderGuests);

    document.getElementById("refreshBtn").addEventListener("click", async () => {
      await loadGuests();
      showNotice("Guest list refreshed.");
    });

    /* ------------------------------------------------------------
       ADD / EDIT
       ------------------------------------------------------------ */

    document.getElementById("addGuestBtn").addEventListener("click", () => {
      openGuestModal();
    });

    function generateNextTicketId() {
      let maxNumber = 0;

      allGuests.forEach(guest => {
        const match = String(guest.ticketId || "").trim().toUpperCase().match(/^ELY-(\d+)$/);
        if (match) {
          maxNumber = Math.max(maxNumber, parseInt(match[1], 10));
        }
      });

      return `ELY-${String(maxNumber + 1).padStart(4, "0")}`;
    }

    function openGuestModal(guest = null) {
      hideFormError();
      guestForm.reset();

      if (guest) {
        modalTitle.textContent = "Edit Guest";
        editingOriginalNic.value = guest.docId;
        document.getElementById("guestName").value = guest.name;
        document.getElementById("guestNic").value = guest.nic;
        document.getElementById("guestPhone").value = guest.phone;
        document.getElementById("guestTicketId").value = guest.ticketId;
      } else {
        modalTitle.textContent = "Add Guest";
        editingOriginalNic.value = "";
        document.getElementById("guestTicketId").value = generateNextTicketId();
      }

      modalBackdrop.classList.add("open");
      setTimeout(() => document.getElementById("guestName").focus(), 80);
    }

    function closeGuestModal() {
      modalBackdrop.classList.remove("open");
      hideFormError();
    }

    document.getElementById("cancelModalBtn").addEventListener("click", closeGuestModal);

    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) closeGuestModal();
    });

    window.editGuest = function(docId) {
      const guest = allGuests.find(item => item.docId === docId);

      if (!guest) {
        showNotice("Guest record could not be found.", "error");
        return;
      }

      openGuestModal(guest);
    };

    guestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideFormError();

      const name = document.getElementById("guestName").value.trim();
      const nic = normalizeNIC(document.getElementById("guestNic").value);
      const phone = document.getElementById("guestPhone").value.trim();
      const ticketId = document.getElementById("guestTicketId").value.trim().toUpperCase();
      const originalNic = editingOriginalNic.value.trim();

      if (!name || !nic || !phone || !ticketId) {
        showFormError("Please complete all four fields.");
        return;
      }

      const saveBtn = document.getElementById("saveGuestBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "SAVING...";

      try {
        const newData = {
          name,
          nic,
          phone,
          ticketId
        };

        if (!originalNic) {
          // ADD
          const existing = await db.collection("guests").doc(nic).get();

          if (existing.exists) {
            showFormError("A guest with this NIC already exists.");
            return;
          }

          await db.collection("guests").doc(nic).set(newData);
          showNotice("Guest added successfully.");

        } else if (originalNic === nic) {
          // EDIT without changing document ID
          await db.collection("guests").doc(originalNic).update(newData);
          showNotice("Guest updated successfully.");

        } else {
          // NIC changed: create new document, then delete old one.
          const newRef = db.collection("guests").doc(nic);
          const oldRef = db.collection("guests").doc(originalNic);

          const newSnap = await newRef.get();

          if (newSnap.exists) {
            showFormError("The new NIC already belongs to another guest.");
            return;
          }

          const oldSnap = await oldRef.get();

          if (!oldSnap.exists) {
            showFormError("Original guest record no longer exists.");
            return;
          }

          await newRef.set(newData);
          await oldRef.delete();

          showNotice("Guest updated successfully.");
        }

        closeGuestModal();
        await loadGuests();

      } catch (error) {
        console.error("Save guest error:", error);

        if (error && error.code === "permission-denied") {
          showFormError("Permission denied. Please make sure you are logged in as the admin.");
        } else {
          showFormError("Could not save this guest. Please try again.");
        }

      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Guest";
      }
    });

    /* ------------------------------------------------------------
       DELETE
       ------------------------------------------------------------ */

    window.deleteGuest = async function(docId) {
      const guest = allGuests.find(item => item.docId === docId);

      if (!guest) {
        showNotice("Guest record could not be found.", "error");
        return;
      }

      const confirmed = confirm(
        `Delete this guest?\n\nName: ${guest.name}\nNIC: ${guest.nic}\nTicket: ${guest.ticketId}\n\nThis cannot be undone.`
      );

      if (!confirmed) return;

      try {
        await db.collection("guests").doc(docId).delete();
        showNotice("Guest deleted successfully.");
        await loadGuests();

      } catch (error) {
        console.error("Delete guest error:", error);

        if (error && error.code === "permission-denied") {
          showNotice("Permission denied. You are not authorized to delete guests.", "error");
        } else {
          showNotice("Could not delete this guest.", "error");
        }
      }
    };
  </script>
</body>
</html>
